services:
  - type: web
    name: kol-pump-bot
    env: python
    region: oregon          # change to nearest (europe if better)
    plan: starter           # Free will sleep → Starter ~$7/mo for real 24/7
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"