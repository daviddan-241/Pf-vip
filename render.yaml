services:
  - type: worker
    name: crypto-kol-pump-bot
    env: python
    region: oregon  # or closest to you (frankfurt, singapore, etc.)
    plan: starter   # free may timeout often – starter is ~$7/mo & more reliable
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    autoDeploy: true
    healthCheckPath: ""   # not needed for worker
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"        # better logging